<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="contact-visual-title contact-visual-desc">
  <title id="contact-visual-title">TRAKNOVA support team illustration</title>
  <desc id="contact-visual-desc">A support team working with rugged mobile devices at an office desk, with warehouse racking visible through a window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a2b"/>
      <stop offset="1" stop-color="#162c49"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3c61"/>
      <stop offset="1" stop-color="#102440"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2e49"/>
      <stop offset="1" stop-color="#0e1b2d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2c52"/>
      <stop offset=".55" stop-color="#1d5fae"/>
      <stop offset="1" stop-color="#3b8fe0"/>
    </linearGradient>
    <linearGradient id="screenSmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#174a84"/>
      <stop offset="1" stop-color="#2f7fd1"/>
