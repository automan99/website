    <linearGradient id="sweater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6ec4"/>
      <stop offset="1" stop-color="#1c4c94"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb52e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb52e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4a90e2" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4a90e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
